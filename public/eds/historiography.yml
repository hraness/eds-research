  - id: hist-beighton-score-1973
    kind: event
    title: Beighton score published for epidemiological joint-mobility assessment
    summary: Beighton, Solomon, and Soskolne published the nine-point articular mobility score in an Annals of the Rheumatic Diseases population study — designed for epidemiology, later adopted as the clinical hypermobility measure still used in the 2017 hEDS criteria.
    date: "1973"
    date_precision: year
    subtypes: [all-eds]
    status: established
    criteria_era: pre-nosology
    evidence:
