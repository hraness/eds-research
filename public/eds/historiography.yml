    people: [Edvard Ehlers]
  - id: hist-danlos-1908
    kind: event
    title: Henri-Alexandre Danlos fixes skin extensibility and fragility as cardinal features
    summary: French physician Henri-Alexandre Danlos, working with Pautier, described the skin features that completed the syndrome's early clinical picture. Decades later it emerged that Danlos's own case was likely pseudoxanthoma elasticum — an early lesson in the hazards of phenotype-only classification.
    date: "1908"
    date_precision: year
    subtypes: [unspecified]
    status: historical-record
    criteria_era: pre-nosology
