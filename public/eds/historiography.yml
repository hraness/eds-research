    reviewed_at: "2026-09-16"
    people: [Peter Beighton]
  - id: hist-berlin-1988
    kind: event
    title: Berlin nosology expands EDS to eleven numbered types
    summary: The 1988 Berlin nosology for heritable connective-tissue disorders expanded EDS into eleven numbered types — a proliferation that blurred clinical boundaries and set up the later consolidation.
    date: "1988"
    date_precision: year
    subtypes: [all-eds]
    status: historical-record
    criteria_era: berlin-1988
