  - id: hist-named-ehlers-danlos-1949
    kind: event
    title: Johnson and Falls name the Ehlers-Danlos syndrome
    summary: The eponym joining Ehlers's and Danlos's names entered the literature in 1949, consolidating several separately described case families under one label.
    date: "1949"
    date_precision: year
    subtypes: [unspecified]
