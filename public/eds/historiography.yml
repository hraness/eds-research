  - id: hist-villefranche-1997
    kind: event
    title: Villefranche nosology consolidates to six types
    summary: Beighton et al. published the revised Villefranche nosology (1997, printed 1998) consolidating EDS to six major types — classical (I/II), hypermobility (III), vascular (IV), kyphoscoliosis (VI), arthrochalasia (VIIA/B), dermatosparaxis (VIIC) — aligning clinical types with the emerging molecular era.
    date: "1998"
    date_precision: year
    subtypes: [all-eds]
    status: established
    criteria_era: villefranche-1997
    evidence:
      - stratum: clinical
        tier: consensus-statement
        source_ids: [source-a0e3bc5bd3a0b3545cf8]
    reviewed_at: "2026-09-16"
  - id: hist-international-2017
    kind: event
    title: 2017 International Classification defines thirteen subtypes
    summary: "Malfait et al. and the International EDS Consortium published the current classification: thirteen subtypes, molecular confirmation required for all except hEDS, a pathogenetic scheme grouping by pathway, and the companion framework separating hEDS from HSD. Management guidelines for comorbidities accompanied the criteria for the first time."
    date: "2017-03"
    date_precision: month
    subtypes: [all-eds]
    status: established
    criteria_era: international-2017
    evidence:
