  - id: hist-sack-1936-dysvascularis
    kind: event
    title: Sack describes status dysvascularis
    summary: Georg Sack described the vascular catastrophe form — arterial rupture and organ fragility — later formalized as the vascular type. This is the historical root of vEDS recognition.
    date: "1936"
    date_precision: year
    subtypes: [veds]
    status: historical-record
    criteria_era: pre-nosology
