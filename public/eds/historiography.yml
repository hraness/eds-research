      - stratum: community
        tier: patient-org-synthesis
        source_ids: [source-c55aca51ea775bf6d160]
        note: The society's type pages present the same 13-type structure to patients.
    corroboration: convergent
    reviewed_at: "2026-09-16"
    people: [Fransiska Malfait]
    organizations: [International EDS Consortium, The Ehlers-Danlos Society]
  - id: hist-klk15-2025
    kind: event
    title: KLK15 identified as the first gene associated with hEDS
    summary: "The Norris Lab and colleagues published whole-exome work implicating kallikrein-family variants in hEDS: a recurrent KLK15 missense variant segregating in multiple families, burden enrichment across KLK genes, and a knock-in mouse recapitulating connective-tissue features. Published in iScience (August 2025) after a 2024 preprint and society announcement; hEDS remains a clinical diagnosis pending replication and HEDGE results."
    date: "2025-08"
