schema: eds-research/corpus/v1
category:
  id: historiography
  label: Disease historiography
  description: "How the EDS concept formed: first descriptions, performer-era records, nosology revisions, and the modern classification era."
  order: 10
records:
  - id: hist-hippocratic-early-accounts
    kind: event
    title: Early descriptions of laxity and bruising attributed to antiquity
    summary: The standard historiography (Parapia and Jackson, 2008) traces descriptions consistent with joint laxity and easy bruising to Hippocratic-era medicine. These are retrospective attributions — the syndrome concept did not exist — and are indexed here as historical framing, not diagnosis.
    date: "-0400"
    date_precision: century
    subtypes: [unspecified]
    status: historical-record
    criteria_era: pre-nosology
    evidence:
      - stratum: historical
        tier: retrospective-account
        source_ids: [source-5c33d96b50581fbe82f8]
        note: Parapia and Jackson trace the earliest descriptions to Hippocrates, c. 400 BC.
    reviewed_at: "2026-09-16"
    tags: [retrospective-attribution]
  - id: hist-van-meekren-1682
    kind: event
    title: van Meek'ren reports extraordinary skin extensibility
    summary: Amsterdam surgeon Job Janszoon van Meek'ren documented a 23-year-old patient who could pull the skin of the chest over the head — commonly cited as the first detailed clinical description of the skin phenotype later associated with EDS.
    date: "1682"
    date_precision: year
    subtypes: [unspecified]
    status: historical-record
    criteria_era: pre-nosology
    evidence:
      - stratum: historical
        tier: primary-historical-document
        source_ids: [source-5c33d96b50581fbe82f8, source-3dd9471fb00916c6141b]
        note: Recorded through the historical-review literature; the original report is a 1682 Amsterdam surgical text.
    reviewed_at: "2026-09-16"
    tags: [retrospective-attribution, skin-phenotype]
  - id: hist-early-circus-performers
    kind: event
    title: "India Rubber Men and elastic performers in travelling shows"
    summary: Late nineteenth-century travelling shows featured performers whose extreme flexibility and skin elasticity were their livelihood — James Morris at Barnum and Bailey earned $150 per week in the 1880s. Medical literature of the era (Wile 1883, Gould and Pyle 1897) documented some of them. Retrospective attribution to EDS is plausible for some performers and unprovable for most; the record documents the social niche, not a diagnosis.
    date: "1883"
    date_precision: decade
    subtypes: [unspecified]
    status: historical-record
    criteria_era: pre-nosology
    evidence:
      - stratum: historical
        tier: contemporaneous-clinical-account
        source_ids: [source-5c33d96b50581fbe82f8]
        note: Wile 1883 and Gould and Pyle 1897 as cited by Parapia and Jackson.
    reviewed_at: "2026-09-16"
    tags: [folk-context, performers, retrospective-attribution]
  - id: hist-chernogubov-1892
    kind: event
    title: Chernogubov presents the first modern case reports
    summary: Nikolai Chernogubov (Tschernogobow) presented two patients to the Moscow Venereology and Dermatology Society with skin fragility and hyperelasticity, joint hypermobility and luxation, and molluscoid pseudotumours — the first comprehensive modern case description. The syndrome is still known as Chernogubov's syndrome in Russian literature.
    date: "1892"
    date_precision: year
    subtypes: [unspecified]
    status: historical-record
    criteria_era: pre-nosology
    evidence:
      - stratum: historical
        tier: primary-historical-document
        source_ids: [source-3dd9471fb00916c6141b]
      - stratum: historical
        tier: retrospective-account
        source_ids: [source-5c33d96b50581fbe82f8]
      - stratum: clinical
        tier: expert-review
        source_ids: [source-be972ed50decef4cbf0b]
    corroboration: convergent
    reviewed_at: "2026-09-16"
    people: [Nikolai Chernogubov]
  - id: hist-ehlers-1901
    kind: event
    title: Edvard Ehlers recognizes the syndrome as a distinct entity
    summary: Danish dermatologist Edvard Lauritz Ehlers published a case report of a patient with joint laxity, stretchy skin, easy bruising, frequent knee subluxations, and delayed walking — the description for which the syndrome is named.
    date: "1901"
    date_precision: year
    subtypes: [unspecified]
    status: historical-record
    criteria_era: pre-nosology
    evidence:
