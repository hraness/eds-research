    reviewed_at: "2026-09-16"
    reassess_by: "2027-03-16"
    tags: [pain]
  - id: mgmt-surgical-caution
    kind: practice
    title: Surgical and tissue-handling caution
    summary: Tissue fragility, wound-healing complications, and — in vEDS — arterial rupture risk make surgery a deliberate decision. The 2017 orthopaedic guidance favors conservative management; the record is cautious rather than prohibitionist.
    subtypes: [all-eds]
    status: probable
    criteria_era: international-2017
    practice_kind: procedural
    evidence:
      - stratum: clinical
        tier: expert-review
        source_ids: [source-1ad3f0edd57e0fab1524]
      - stratum: clinical
        tier: expert-review
        source_ids: [source-be972ed50decef4cbf0b]
    reviewed_at: "2026-09-16"
    risk:
      level: significant
      note: In vEDS, arterial and organ rupture make surgical and anesthetic decisions materially different from other types; subtype scoping is not optional here.
    tags: [surgery, tissue-fragility]
  - id: mgmt-psych-support
    kind: practice
    title: Psychological support and trauma-informed care
    summary: The diagnostic-odyssey literature documents medical gaslighting and post-traumatic stress in hEDS patients; management guidance includes psychological support. The 2025 BMJ phenomenological study urges trauma-informed care at the point of diagnosis.
    date: "2025"
    date_precision: year
