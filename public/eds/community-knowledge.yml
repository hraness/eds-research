    tags: [anesthesia, dental, medication]
  - id: signal-diagnosis-navigation
    kind: signal
    title: Diagnosis navigation and specialist-finding strategies
    summary: Community venues maintain informal routing — which specialists diagnose, which tests matter, how to prepare a diagnostic case. This is the community's response to the documented multi-year diagnostic delay, not a clinical pathway.
    subtypes: [heds, hsd]
    status: community-signal
    criteria_era: international-2017
