        tier: consensus-statement
        source_ids: [source-36ad1cab53c4cea4f4b4, source-a0e3bc5bd3a0b3545cf8]
    reviewed_at: "2026-09-16"
    tags: [methodology, criteria]
  - id: dx-heds-remains-clinical
    kind: finding
    title: hEDS diagnosis remains clinical despite the KLK15 finding
    summary: The Ehlers-Danlos Society and the KLK15 authors both state that kallikrein genes are not yet on EDS testing panels and that hEDS remains a clinical diagnosis. Replication and the HEDGE study results are the gating evidence.
