  - id: com-misdiagnosis-load
    kind: finding
    title: In a registry survey, people with hEDS reported about ten other diagnoses
    summary: A Global Registry survey of 505 people with clinically confirmed hEDS, published in 2023, found an average of 10.45 other diagnoses. Anxiety, depression, and migraine were the most common. Participants most often rejected functional neurological disorder, multiple sclerosis, and fibromyalgia as wrong, and most often endorsed POTS, cervical instability, and MCAS as accurate.
    date: "2023"
    date_precision: year
    subtypes: [heds]
    status: probable
    criteria_era: international-2017
    evidence:
      - stratum: registry
        tier: registry-analysis
        source_ids: [source-9a67b455782a95159bd9]
      - stratum: clinical
        tier: qualitative-study
        source_ids: [source-21337422dde3976b584c]
        note: A 2025 qualitative study describes misdiagnosis and dismissal on the way to an hEDS diagnosis.
    corroboration: convergent
    reviewed_at: "2026-09-16"
    tags: [misdiagnosis, registry]
  - id: com-cci-tethered-cord
    kind: finding
    title: "Craniocervical instability and tethered cord in hEDS: contested"
    description: Craniocervical instability and tethered cord come up often in hEDS patient communities. Controlled evidence is limited, and surgery carries real risk.
    summary: Craniocervical instability (CCI) and tethered cord come up often in patient communities, and cervical instability was one of the diagnoses participants most often endorsed as accurate in a Global Registry survey of people with hEDS. Controlled evidence is limited, and surgery for these conditions carries real risk.
    subtypes: [heds, ceds]
    status: contested
    criteria_era: international-2017
    evidence:
      - stratum: community
        tier: cross-venue-pattern
        source_ids: [source-ec36295ad04f34148c63, source-641ce29242a70e8a5f01]
      - stratum: registry
        tier: registry-analysis
        source_ids: [source-9a67b455782a95159bd9]
        note: Cervical instability was among the diagnoses participants most often endorsed as accurate.
    corroboration: convergent
    venues: [venue-reddit-ehlersdanlos, venue-inspire-eds-hsd]
