records:
  - id: com-trifecta-pattern
    kind: signal
    title: "The “trifecta”: hEDS, POTS, and mast cell activation reported together"
    description: Patient communities often describe hEDS, POTS, and mast cell activation syndrome occurring together, and call the combination the “trifecta”.
    summary: Patient communities often describe hEDS, POTS (a form of dysautonomia), and mast cell activation syndrome (MCAS) occurring together, and call the combination the “trifecta”. In a Global Registry survey of 505 people with hEDS, POTS and MCAS were among the diagnoses participants most often endorsed as accurate. Whether the three share a mechanism is unknown.
    subtypes: [heds, hsd]
    status: community-signal
    criteria_era: international-2017
    evidence:
      - stratum: community
        tier: cross-venue-pattern
        source_ids: [source-ec36295ad04f34148c63, source-641ce29242a70e8a5f01]
        note: Recurring across Reddit and Inspire over multiple years.
      - stratum: registry
        tier: registry-analysis
        source_ids: [source-9a67b455782a95159bd9]
        note: POTS and MCAS were among the diagnoses participants most often endorsed as accurate.
    corroboration: convergent
    venues: [venue-reddit-ehlersdanlos, venue-inspire-eds-hsd]
    reviewed_at: "2026-09-16"
    reassess_by: "2026-12-16"
    tags: [dysautonomia, mcas, trifecta]
  - id: com-multisystem-2017
    kind: finding
    title: The 2017 classification papers cover symptoms beyond joints and skin
    description: The 2017 hEDS criteria count connective-tissue signs such as hernias and prolapse. Papers published with them also review pain and other symptoms.
    summary: "The hEDS criteria in the 2017 classification count signs of a more generalized connective tissue disorder, such as soft skin, hernias, pelvic floor prolapse, mitral valve prolapse, and aortic root dilatation. Digestive, autonomic, pain, and fatigue problems are not diagnostic criteria, but papers published alongside the classification describe them: Tinkle and colleagues review the symptoms and disorders reported with hEDS, and Chopra and colleagues review chronic pain in EDS."
    date: "2017-03"
    date_precision: month
    subtypes: [all-eds]
    status: established
    criteria_era: international-2017
    evidence:
      - stratum: clinical
        tier: consensus-statement
        source_ids: [source-36ad1cab53c4cea4f4b4]
      - stratum: clinical
        tier: expert-review
        source_ids: [source-1ad3f0edd57e0fab1524, source-d7ba05272083315d9e1f]
