    reassess_by: "2026-12-16"
    tags: [cci, tethered-cord, contested]
  - id: com-gi-dysautonomia-cluster
    kind: finding
    title: GI dysmotility and autonomic features are documented comorbidity domains
    description: A 2017 review describes digestive dysmotility and autonomic problems, including POTS, as common comorbidities in hEDS and HSD.
    summary: The 2017 series and subsequent cohort work document gastrointestinal dysmotility (reflux, gastroparesis, constipation) and autonomic dysfunction (orthostatic intolerance, POTS) as leading comorbidity domains in hEDS/HSD. In a 2025 survey at a German EDS clinic, musculoskeletal pain and joint instability were the most common first symptoms.
    subtypes: [heds, hsd]
    status: probable
    criteria_era: international-2017
    evidence:
      - stratum: clinical
        tier: expert-review
        source_ids: [source-1ad3f0edd57e0fab1524]
      - stratum: clinical
        tier: cross-sectional-study
        source_ids: [source-de164233cddfefc4105a]
    reviewed_at: "2026-09-16"
    tags: [gi, dysautonomia]
