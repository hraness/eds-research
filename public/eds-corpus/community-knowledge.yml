records:
  - id: signal-subluxation-load
    kind: signal
    title: Subluxation, braces, taping, and joint-stabilization self-management
    summary: Much of the practical discussion in patient communities is about joints that partly slip out of place (subluxation) rather than fully dislocate. Members swap taping, bracing, and stabilizing techniques, often for subluxations no doctor has confirmed. Clinical literature treats subluxation as close to, but not itself, a diagnostic criterion; the community discussion is about day-to-day management rather than diagnosis.
    subtypes: [heds, hsd, ceds]
    status: community-signal
    criteria_era: era-independent
    evidence:
      - stratum: community
        tier: cross-venue-pattern
        source_ids: [source-ec36295ad04f34148c63, source-641ce29242a70e8a5f01]
      - stratum: community
        tier: single-venue-pattern
        source_ids: [source-2fd8a13a36c4a8bd2b01]
    venues: [venue-reddit-ehlersdanlos, venue-inspire-eds-hsd]
    reviewed_at: "2026-09-16"
    reassess_by: "2026-12-16"
    tags: [subluxation, self-management]
  - id: signal-pt-that-knows-eds
    kind: signal
    title: Finding “a PT who knows EDS”
    summary: Members treat finding a physical therapist as a search problem. They share directories and word-of-mouth referrals and look for therapists who avoid the generic exercise programs members consider harmful.
    subtypes: [heds, hsd]
    status: community-signal
    criteria_era: era-independent
