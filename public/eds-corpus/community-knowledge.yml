    reviewed_at: "2026-09-16"
    reassess_by: "2026-12-16"
    tags: [anesthesia, dental, medication]
  - id: signal-diagnosis-navigation
    kind: signal
    title: Diagnosis navigation and specialist-finding strategies
    description: Members of EDS patient communities share advice on which specialists diagnose EDS, which tests matter, and how to prepare for an appointment.
    summary: Members share advice on which specialists diagnose EDS, which tests matter, and how to prepare for an appointment, in response to diagnostic delays that often last years. This is peer advice, not a clinical pathway.
    subtypes: [heds, hsd]
    status: community-signal
    criteria_era: international-2017
    evidence:
