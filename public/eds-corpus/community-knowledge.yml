  - id: signal-meds-anesthesia-cautions
    kind: signal
    title: Medication, dental, and procedural caution knowledge
    description: Patient communities keep lists of cautions about local anesthetics that wear off early, flares after surgery, and sensitivity to medications.
    summary: Patient communities keep long-running lists of cautions about local anesthetics that wear off early, flares after surgery, and reported sensitivity to medications, many of them predating clinical study. Surveys and a 2026 trial have since supported the anesthetic reports; the medication-sensitivity reports remain anecdotal.
    subtypes: [all-eds]
    status: community-signal
    criteria_era: era-independent
    evidence:
