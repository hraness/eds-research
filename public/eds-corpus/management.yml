  - id: mgmt-surgical-caution
    kind: practice
    title: Surgical and tissue-handling caution
    summary: Fragile tissue, poor wound healing, and, in vEDS, the risk of arterial rupture make surgery a weighed decision. The National Academies' 2022 report says all conservative, nonsurgical measures should be exhausted before surgery is considered for people with EDS or HSD.
    subtypes: [all-eds]
    status: probable
    criteria_era: international-2017
    practice_kind: procedural
