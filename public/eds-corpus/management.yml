  - id: mgmt-lidocaine-resistance
    kind: practice
    title: "Local anesthetic resistance in EDS: patient reports, two surveys, and a 2026 trial"
    summary: People with EDS often report that local anesthetics fail or wear off early. In a survey reported in 2005, 58% of women with symptomatic joint hypermobility syndrome recalled poor local anesthetic effect, against 21% of women without hypermobility. In a 2019 online survey, 88% of 980 people with EDS who had a dental local anesthetic recalled inadequate pain prevention, against 33% of 249 people without EDS. A randomized cross-over trial published in 2026 (135 participants, 91 with EDS) found that fewer participants with EDS still had numbness 15 and 30 minutes after a lidocaine injection, which the authors read as a shorter-lasting effect.
    date: "2026-03"
    date_precision: month
    subtypes: [all-eds]
    status: established
