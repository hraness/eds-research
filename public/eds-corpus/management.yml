    reviewed_at: "2026-09-16"
    risk:
      level: significant
      note: In vEDS, the risk of arterial and organ rupture makes surgical and anesthetic decisions different from those in other types.
    tags: [surgery, tissue-fragility]
  - id: mgmt-psych-support
    kind: practice
    title: Psychological support and trauma-informed care
    summary: Studies of the diagnostic journey in hEDS describe medical gaslighting and post-traumatic stress, and management guidance includes psychological support. A 2025 qualitative study of people with hEDS says physicians should be aware of possible medical post-traumatic stress disorder and highlights the importance of trauma-informed care.
