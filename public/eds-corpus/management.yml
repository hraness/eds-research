  - id: mgmt-pain-management-2017
    kind: practice
    title: A 2017 review of pain management in EDS
    summary: Chopra and colleagues' 2017 review describes chronic pain as common in EDS and often one of the first symptoms. It traces pain to causes including subluxations and dislocations, earlier surgery, muscle weakness, and proprioceptive problems, and discusses physical therapy, medications, and equipment such as cushions, compression garments, and braces. The authors say studies of these treatments are few and insufficient to guide management.
