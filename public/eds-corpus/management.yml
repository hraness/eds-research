  - id: mgmt-pt-mainstay
    kind: practice
    title: Physical therapy and exercise are the main management approach
    summary: Clinical guidance gives individualized physical therapy (strengthening, proprioceptive work, and pacing) a central role in managing hEDS and HSD. A 2017 paper on physical therapy by Engelbert and colleagues says the research on managing these conditions is limited in size and quality, so the advice rests more on expert consensus and clinical experience than on large trials.
    subtypes: [heds, hsd]
    status: probable
    criteria_era: international-2017
    practice_kind: physical-therapy
    evidence:
      - stratum: clinical
        tier: expert-review
        source_ids: [source-1ad3f0edd57e0fab1524]
      - stratum: clinical
        tier: expert-review
        source_ids: [source-328501b217c2b3d0d2d2]
    reviewed_at: "2026-09-16"
    reassess_by: "2027-03-16"
    risk:
      level: caution
      note: Generic exercise programs can aggravate unstable joints; the guidance favors individualized programs.
