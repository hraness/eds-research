  - id: gen-heds-no-confirmed-gene
    kind: finding
    title: hEDS is the only subtype without a confirmed molecular basis
    summary: All twelve other 2017 subtypes have defined causative genes. For hEDS — the most common type — no confirmed molecular basis existed through 2024, forcing purely clinical diagnosis and the strict 2017 criteria as the only gate.
    subtypes: [heds]
    status: established
    criteria_era: international-2017
