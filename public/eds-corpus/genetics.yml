    kind: finding
    title: hEDS is the only subtype without a confirmed molecular basis
    description: All twelve other types in the 2017 classification have known causative genes. hEDS, the most common type, has no confirmed gene.
    summary: All twelve other types in the 2017 classification have known causative genes. hEDS, the most common type, has no confirmed molecular basis, so it is diagnosed from clinical criteria alone under the 2017 classification.
