  - id: gen-hedge-study
    kind: program
    title: HEDGE — the 1,000-participant hEDS genetic evaluation
    summary: The Hypermobile Ehlers-Danlos Genetic Evaluation study is the largest dedicated hEDS genetics effort, run under The Ehlers-Danlos Society's research program. First publications were expected late 2025 into 2026; this index tracks it as the pivotal watch item for the subtype.
