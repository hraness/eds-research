  - id: hist-sack-1936-dysvascularis
    kind: event
    title: Sack describes status dysvascularis
    summary: Georg Sack described a form with arterial rupture and organ fragility that was later formalized as the vascular type. This is the historical root of vEDS recognition.
    date: "1936"
    date_precision: year
    subtypes: [veds]
    status: historical-record
    criteria_era: pre-nosology
    evidence:
      - stratum: historical
        tier: retrospective-account
        source_ids: [source-5c33d96b50581fbe82f8]
    reviewed_at: "2026-09-16"
    people: [Georg Sack]
  - id: hist-named-ehlers-danlos-1949
    kind: event
    title: Johnson and Falls name the Ehlers-Danlos syndrome
    summary: The eponym joining Ehlers's and Danlos's names entered the literature in 1949, consolidating several separately described case families under one label.
    date: "1949"
    date_precision: year
    subtypes: [unspecified]
    status: refuted
    criteria_era: pre-nosology
    evidence:
      - stratum: historical
        tier: retrospective-account
        source_ids: [source-5c33d96b50581fbe82f8]
      - stratum: clinical
        tier: expert-review
        source_ids: [source-be972ed50decef4cbf0b]
        note: The chapter credits Johnson and Falls (1949) with the first report of autosomal-dominant inheritance, in a family with 32 affected members, and cites Ronchese's 1936 paper on “the so-called Ehlers-Danlos syndrome”.
    corroboration: refuted
    reviewed_at: "2026-09-16"
  - id: hist-barabas-1967-vascular
    kind: event
    title: Barabas establishes heterogeneity and the arterial complication profile
    summary: A. P. Barabas demonstrated that EDS was heterogeneous and delineated the form with arterial complications, the direct ancestor of the vascular subtype (type IV in Villefranche, vEDS today).
    date: "1967"
    date_precision: year
    subtypes: [veds]
    status: historical-record
    criteria_era: pre-nosology
