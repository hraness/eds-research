    people: [Edvard Ehlers]
  - id: hist-danlos-1908
    kind: event
    title: Henri-Alexandre Danlos fixes skin extensibility and fragility as cardinal features
    summary: French physician Henri-Alexandre Danlos, working with Pautier, described the skin features that completed the syndrome's early clinical picture.
    date: "1908"
    date_precision: year
    subtypes: [unspecified]
