category:
  id: historiography
  label: Disease historiography
  description: "How the EDS concept formed: first descriptions, performer-era records, nosology revisions, and the modern classification era."
  order: 10
records:
  - id: hist-hippocratic-early-accounts
    kind: event
    title: Early descriptions of laxity and bruising attributed to antiquity
    summary: "The standard historiography (Parapia and Jackson, 2008) traces descriptions consistent with joint laxity and easy bruising to Hippocratic-era medicine. These are attributions made in hindsight: the syndrome had not been described, and no one in these accounts was diagnosed with it."
    date: "-0400"
    date_precision: century
    subtypes: [unspecified]
    status: historical-record
    criteria_era: pre-nosology
    evidence:
      - stratum: historical
        tier: retrospective-account
        source_ids: [source-5c33d96b50581fbe82f8]
        note: Parapia and Jackson trace the earliest descriptions to Hippocrates, c. 400 BC.
    reviewed_at: "2026-09-16"
    tags: [retrospective-attribution]
  - id: hist-van-meekren-1682
    kind: event
    title: van Meek'ren reports extraordinary skin extensibility
    summary: Amsterdam surgeon Job Janszoon van Meek'ren documented a 23-year-old patient who could pull the skin of the chest over the head. The report is commonly cited as the first detailed clinical description of the skin phenotype later associated with EDS.
    date: "1682"
    date_precision: year
    subtypes: [unspecified]
    status: historical-record
    criteria_era: pre-nosology
    evidence:
      - stratum: historical
        tier: retrospective-account
        source_ids: [source-5c33d96b50581fbe82f8]
        note: Recorded through the historical-review literature; the original report is a 1682 Amsterdam surgical text.
    reviewed_at: "2026-09-16"
    tags: [retrospective-attribution, skin-phenotype]
  - id: hist-early-circus-performers
    kind: event
    title: "India Rubber Men and elastic performers in travelling shows"
    summary: Late nineteenth-century travelling shows featured performers whose extreme flexibility and skin elasticity were their livelihood. James Morris, who performed with Barnum and Bailey, earned $150 per week in the 1880s. Medical literature of the era (Wile 1883, Gould and Pyle 1897) documented some of them. Attributing EDS to them in hindsight is plausible for some performers and unprovable for most.
    date: "1883"
    date_precision: decade
    subtypes: [unspecified]
    status: historical-record
    criteria_era: pre-nosology
    evidence:
      - stratum: historical
        tier: retrospective-account
        source_ids: [source-5c33d96b50581fbe82f8]
        note: Wile 1883 and Gould and Pyle 1897 as cited by Parapia and Jackson.
    reviewed_at: "2026-09-16"
    tags: [folk-context, performers, retrospective-attribution]
  - id: hist-chernogubov-1892
    kind: event
    title: Chernogubov presents the first modern case reports
    description: In 1892 Nikolai Chernogubov presented two patients with fragile, stretchy skin and loose joints to a Moscow medical society.
    summary: Nikolai Chernogubov (Tschernogobow) presented two patients to the Moscow Venereology and Dermatology Society with skin fragility and hyperelasticity, joint hypermobility and luxation, and molluscoid pseudotumours. It is the first comprehensive modern case description. The syndrome is still known as Chernogubov's syndrome in Russian literature.
    date: "1892"
    date_precision: year
    subtypes: [unspecified]
    status: historical-record
    criteria_era: pre-nosology
    evidence:
      - stratum: historical
        tier: primary-historical-document
        source_ids: [source-fd495bad5265f19454c2]
      - stratum: historical
        tier: retrospective-account
        source_ids: [source-5c33d96b50581fbe82f8]
      - stratum: clinical
        tier: expert-review
        source_ids: [source-be972ed50decef4cbf0b]
    corroboration: single-origin
    reviewed_at: "2026-09-16"
    people: [Nikolai Chernogubov]
  - id: hist-ehlers-1901
    kind: event
    title: Edvard Ehlers recognizes the syndrome as a distinct entity
    description: In 1901 Danish dermatologist Edvard Ehlers reported a patient with loose joints, stretchy skin, easy bruising, and knee subluxations.
    summary: Danish dermatologist Edvard Lauritz Ehlers published a case report of a patient with joint laxity, stretchy skin, easy bruising, frequent knee subluxations, and delayed walking. The syndrome takes part of its name from this description.
    date: "1901"
    date_precision: year
    subtypes: [unspecified]
    status: historical-record
    criteria_era: pre-nosology
    evidence:
