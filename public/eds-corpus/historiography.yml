    people: [A. P. Barabas]
  - id: hist-beighton-score-1973
    kind: event
    title: Beighton score published for epidemiological joint-mobility assessment
    description: Beighton, Solomon, and Soskolne published the nine-point Beighton score in 1973. The 2017 hEDS criteria use it to measure joint hypermobility.
    summary: Beighton, Solomon, and Soskolne published the nine-point articular mobility score in 1973, in an Annals of the Rheumatic Diseases study of joint mobility in an African population. It was designed for epidemiology and later became the clinical measure of hypermobility used in the 2017 hEDS criteria.
    date: "1973"
    date_precision: year
    subtypes: [all-eds]
    status: established
    criteria_era: pre-nosology
    evidence:
      - stratum: clinical
        tier: cross-sectional-study
        source_ids: [source-0bcf3a495f5d5a3f3899]
      - stratum: clinical
        tier: consensus-statement
        source_ids: [source-36ad1cab53c4cea4f4b4]
        note: The 2017 hEDS criteria assess generalized joint hypermobility with the Beighton score.
    reviewed_at: "2026-09-16"
    people: [Peter Beighton]
  - id: hist-berlin-1988
    kind: event
    title: Berlin nosology expands EDS to eleven numbered types
    summary: The 1988 Berlin nosology for heritable connective-tissue disorders expanded EDS into eleven numbered types. The proliferation blurred clinical boundaries and set up the later consolidation.
    date: "1988"
    date_precision: year
    subtypes: [all-eds]
    status: historical-record
    criteria_era: berlin-1988
    evidence:
      - stratum: historical
        tier: retrospective-account
        source_ids: [source-5c33d96b50581fbe82f8]
      - stratum: clinical
        tier: expert-review
        source_ids: [source-be972ed50decef4cbf0b]
        note: This chapter says nine types of EDS were proposed in the 1988 nosology.
    corroboration: contested
    reviewed_at: "2026-09-16"
  - id: hist-villefranche-1997
    kind: event
    title: Villefranche nosology consolidates to six types
    description: The 1997 Villefranche nosology, published in 1998, consolidated EDS into six major types.
    summary: "Beighton et al. published the revised Villefranche nosology (1997, printed 1998), consolidating EDS into six major types: classical (I/II), hypermobility (III), vascular (IV), kyphoscoliosis (VI), arthrochalasia (VIIA/B), and dermatosparaxis (VIIC). The revision aligned clinical types with the emerging molecular era."
    date: "1998"
    date_precision: year
    subtypes: [all-eds]
    status: established
    criteria_era: villefranche-1997
    evidence:
      - stratum: clinical
        tier: consensus-statement
        source_ids: [source-a0e3bc5bd3a0b3545cf8]
    reviewed_at: "2026-09-16"
  - id: hist-international-2017
    kind: event
    title: 2017 International Classification defines thirteen subtypes
    description: The 2017 International Classification defines thirteen EDS types and requires genetic confirmation for all except hEDS.
    summary: "Malfait et al. and the International EDS Consortium published the current classification: thirteen subtypes, molecular confirmation required for all except hEDS, a pathogenetic scheme grouping by pathway, and the companion framework separating hEDS from HSD. Management guidelines for comorbidities accompanied the criteria for the first time."
    date: "2017-03"
    date_precision: month
    subtypes: [all-eds]
    status: established
    criteria_era: international-2017
    evidence:
      - stratum: clinical
        tier: consensus-statement
        source_ids: [source-36ad1cab53c4cea4f4b4, source-d7dec285eaee780f18a3]
      - stratum: community
        tier: patient-org-synthesis
        source_ids: [source-c55aca51ea775bf6d160]
        note: The society's type pages present the same 13-type structure to patients.
    corroboration: single-origin
    reviewed_at: "2026-09-16"
    people: [Fransiska Malfait]
    organizations: [International EDS Consortium, The Ehlers-Danlos Society]
  - id: hist-klk15-2025
    kind: event
    title: "2025: KLK15 published as a candidate gene for hEDS"
    description: In August 2025 the Norris Lab published a KLK15 variant as a candidate cause of hEDS. hEDS remains a clinical diagnosis.
    summary: "In August 2025 the Norris Lab and colleagues published whole-exome work in iScience implicating kallikrein (KLK) gene variants in hEDS: a recurrent KLK15 variant segregating in multiple families, rare and low-frequency variants in 14 of the 15 KLK genes, and a knock-in mouse with hEDS features in tendons and heart valves. A preprint and The Ehlers-Danlos Society's summary appeared in June 2024. The society says hEDS remains a clinical diagnosis and that replication, including in the HEDGE study, is needed."
    date: "2025-08"
    date_precision: month
    subtypes: [heds]
    status: emerging
    criteria_era: international-2017
    evidence:
