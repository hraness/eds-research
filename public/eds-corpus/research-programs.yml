records:
  - id: prog-dice-registry
    kind: program
    title: The DICE Global Registry collects patient-reported data on EDS and HSD
    summary: The Ehlers-Danlos Society's DICE EDS and HSD Global Registry collects health information that patients report about themselves. A misdiagnosis survey published in 2023 was circulated through it to registry members with hEDS who were also enrolled in the HEDGE genetics study; 505 completed it.
    subtypes: [all-eds]
    status: established
    criteria_era: international-2017
    evidence:
      - stratum: registry
        tier: registry-report
        source_ids: [source-1dfb4ae3ff5aafdd0577]
      - stratum: registry
        tier: registry-analysis
        source_ids: [source-9a67b455782a95159bd9]
        note: The published hEDS misdiagnosis survey was circulated through the registry.
    reviewed_at: "2026-09-16"
    organizations: [The Ehlers-Danlos Society]
    tags: [registry]
  - id: prog-echo
    kind: program
    title: EDS ECHO teaches clinicians and community members about EDS
    summary: EDS ECHO is The Ehlers-Danlos Society's education program for clinicians and community members, built on the Project ECHO model. It is meant to bring research and management knowledge to the clinicians patients see.
    subtypes: [all-eds]
    status: established
    criteria_era: international-2017
    evidence:
      - stratum: registry
        tier: registry-report
        source_ids: [source-2542220d7aa64b3f7ca7]
    reviewed_at: "2026-09-16"
    organizations: [The Ehlers-Danlos Society]
    tags: [education, infrastructure]
  - id: prog-clinicaltrials-portfolio
    kind: program
    title: The ClinicalTrials.gov EDS portfolio
    summary: The US federal trial registry lists interventional and observational EDS studies, including the local anesthetic trial (NCT05603741).
    subtypes: [all-eds]
    status: established
    criteria_era: era-independent
    evidence:
      - stratum: registry
        tier: trial-registration
        source_ids: [source-7caade9be5b82d40a0c7]
    reviewed_at: "2026-09-16"
    reassess_by: "2026-12-16"
    tags: [trials, registry]
  - id: prog-orpha-gard
    kind: program
    title: Orphanet and GARD keep reference records for rare diseases, including EDS
    description: Orphanet and the NIH's GARD keep reference records for rare diseases, including EDS nomenclature and prevalence estimates.
    summary: Orphanet (ORPHA:75531) and the NIH's Genetic and Rare Diseases Information Center (GARD) keep reference records for rare diseases, including EDS nomenclature and prevalence estimates.
    subtypes: [all-eds]
    status: established
    criteria_era: era-independent
